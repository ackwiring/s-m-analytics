[pytest]
; Skills use absolute imports (`from skills.base import ...`) that only
; resolve when webapp/backend is on sys.path - true at runtime because
; main.py is always launched with webapp/backend as cwd, but not true for
; pytest by default. pythonpath makes it true for test collection too,
; without needing __init__.py files or sys.path hacks in conftest.py.
pythonpath = .
testpaths = tests
